[project]
name = "csv-synth"
version = "0.1.0"
description = "Make a synthetic copy of a CSV file, locally."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "sdv==2.2.0",
    "faker>=25",
    "typer>=0.12",
]

[project.scripts]
csv-synth = "csv_synth.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-socket>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csv_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
